<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tageskilometer — Ernährungs- &amp; Trainingscomputer</title>
<style>
  :root{
    --asphalt:#23262B;
    --chalk:#F5F6F3;
    --surface:#FFFFFF;
    --ink:#1B1F1D;
    --ink-soft:#5B625D;
    --route:#3F7D4F;
    --route-dim:#DCEADF;
    --climb:#E08A3C;
    --climb-dim:#FBE9D6;
    --line:#DEE1DC;
    --danger:#B94A3C;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--chalk);
    color:var(--ink);
    font-family:"Work Sans","Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num{
    font-family:"Space Mono","SF Mono",Consolas,monospace;
    font-variant-numeric:tabular-nums;
  }
  .wrap{max-width:640px;margin:0 auto;padding:28px 20px 60px;}

  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--asphalt);
    padding-bottom:14px;
    margin-bottom:22px;
  }
  header.top h1{
    font-size:20px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  header.top .date-pick{
    font-family:"Space Mono",monospace;
    font-size:13px;
    border:1px solid var(--line);
    background:var(--surface);
    padding:6px 8px;
    border-radius:4px;
    color:var(--ink);
  }

  nav.tabs{
    display:flex;
    gap:22px;
    margin-bottom:26px;
    border-bottom:1px solid var(--line);
  }
  nav.tabs button{
    background:none;
    border:none;
    font-family:inherit;
    font-size:14px;
    color:var(--ink-soft);
    padding:10px 2px;
    cursor:pointer;
    border-bottom:2px solid transparent;
  }
  nav.tabs button.active{
    color:var(--ink);
    border-bottom:2px solid var(--route);
    font-weight:600;
  }

  .hero{
    background:var(--asphalt);
    color:var(--chalk);
    border-radius:8px;
    padding:24px;
    margin-bottom:20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:18px;
    box-shadow:0 8px 24px -12px rgba(0,0,0,0.35);
  }
  .hero .hero-main{flex:1;min-width:0;}
  .hero .label{font-size:12px;color:#AEB4AC;margin-bottom:6px;}
  .hero .big{
    font-size:46px;
    line-height:1;
    font-weight:700;
    display:flex;
    align-items:baseline;
    gap:8px;
    transition:color .2s ease;
  }
  .hero .big small{font-size:15px;color:#9BA39C;font-weight:400;}
  .hero .sub{
    display:flex;
    gap:20px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid #3A3E3F;
    flex-wrap:wrap;
  }
  .hero .sub div{font-size:11px;color:#AEB4AC;}
  .hero .sub div .num{display:block;font-size:15px;color:var(--chalk);margin-top:3px;}

  .ring-wrap{position:relative;width:92px;height:92px;flex-shrink:0;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-wrap .ring-track{stroke:#3A3E3F;fill:none;stroke-width:7;}
  .ring-wrap .ring-fill{fill:none;stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .4s ease,stroke .3s ease;}
  .ring-wrap .ring-pct{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:var(--chalk);
  }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    border-radius:8px;
    padding:16px 18px;
    margin-bottom:16px;
  }
  .card.meals{border-left-color:var(--route);}
  .card.rides{border-left-color:var(--climb);}
  .card h2{
    font-size:13px;
    text-transform:none;
    margin:0 0 12px;
    font-weight:600;
    color:var(--ink);
  }
  .card h2 .tag{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:400;
    margin-left:6px;
  }

  .meal-row, .ride-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:14px;
  }
  .meal-row:last-child, .ride-row:last-child{border-bottom:none;}
  .meal-row .row-main, .ride-row .row-main{display:flex;align-items:center;gap:9px;}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .dot.meal{background:var(--route);}
  .dot.ride{background:var(--climb);}
  .row-kcal{font-family:"Space Mono",monospace;color:var(--ink-soft);}
  .meal-row .del, .ride-row .del{
    background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:16px;padding:0 4px;line-height:1;transition:color .15s ease;
  }
  .meal-row .del:hover, .ride-row .del:hover{color:var(--danger);}
  .empty-hint{font-size:13px;color:var(--ink-soft);padding:6px 0;}

  form.add-row{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
  }
  form.add-row select, form.add-row input{
    font-family:inherit;
    font-size:13px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:5px;
    background:var(--chalk);
    color:var(--ink);
    transition:border-color .15s ease;
  }
  form.add-row select:focus, form.add-row input:focus{outline:none;border-color:var(--route);}
  form.add-row input[type=number]{width:92px;}
  form.add-row button{
    background:var(--route);
    color:#fff;
    border:none;
    border-radius:5px;
    padding:9px 16px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s ease,transform .1s ease;
  }
  form.add-row button:hover{opacity:0.88;}
  form.add-row button:active{transform:scale(0.97);}

  .plan-table{width:100%;border-collapse:collapse;}
  .plan-table td{padding:8px 4px;font-size:14px;border-bottom:1px solid var(--line);}
  .plan-table td:first-child{width:44px;font-weight:600;}
  .plan-table input[type=number]{
    width:70px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:13px;background:var(--chalk);color:var(--ink);
  }
  .rest-tag{
    display:inline-block;font-size:12px;color:var(--climb);background:var(--climb-dim);padding:3px 8px;border-radius:3px;
  }

  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .settings-grid .full{grid-column:1/-1;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:4px;}
  .field input, .field select{
    width:100%;padding:8px 9px;border:1px solid var(--line);border-radius:4px;font-family:inherit;font-size:13px;background:var(--chalk);color:var(--ink);
  }
  .split-row{display:flex;gap:10px;align-items:center;}
  .split-row .field{flex:1;}
  .save-btn{
    margin-top:16px;
    background:var(--route);
    color:#fff;border:none;border-radius:4px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .save-btn:hover{opacity:0.9;}
  .save-note{font-size:12px;color:var(--route);margin-left:10px;}
  .info-line{font-size:13px;color:var(--ink-soft);margin-top:14px;line-height:1.6;}
  .info-line .num{color:var(--ink);}
  .warn{color:var(--danger);font-size:12px;margin-top:6px;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
const DAY_KEYS = ["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAY_LABELS = {Mo:"Montag",Di:"Dienstag",Mi:"Mittwoch",Do:"Donnerstag",Fr:"Freitag",Sa:"Samstag",So:"Sonntag"};
const REST_DAYS = ["Do","Sa"];

const DEFAULT_SETTINGS = {
  gender: "m",
  age: 20,
  height: 175,
  weight: 77,
  goalWeight: 70,
  activity: 1.3,
  deficit: 500,
  mealSplit: { mittag: 55, zvieri: 10, znacht: 35 },
  trainingPlan: { Mo:45, Di:30, Mi:45, Do:0, Fr:30, Sa:0, So:60 }
};

let state = {
  tab: "heute",
  date: todayStr(),
  settings: null,
  log: null,
  saveNote: ""
};

function todayStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function weekdayKey(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  const idx = (d.getDay() + 6) % 7; // Mo=0
  return DAY_KEYS[idx];
}

async function loadSettings(){
  try{
    const r = await window.storage.get("settings", false);
    state.settings = r ? JSON.parse(r.value) : {...DEFAULT_SETTINGS};
  }catch(e){
    state.settings = {...DEFAULT_SETTINGS};
  }
}

async function saveSettings(){
  try{
    await window.storage.set("settings", JSON.stringify(state.settings), false);
  }catch(e){
    console.error("Speichern der Einstellungen fehlgeschlagen:", e);
  }
}

async function loadLog(dateStr){
  try{
    const r = await window.storage.get("log:" + dateStr, false);
    state.log = r ? JSON.parse(r.value) : { meals: [], rides: [] };
  }catch(e){
    state.log = { meals: [], rides: [] };
  }
}

async function saveLog(){
  try{
    await window.storage.set("log:" + state.date, JSON.stringify(state.log), false);
  }catch(e){
    console.error("Speichern des Tageslogs fehlgeschlagen:", e);
  }
}

function bmr(){
  const s = state.settings;
  const base = 10*s.weight + 6.25*s.height - 5*s.age;
  return s.gender === "m" ? base + 5 : base - 161;
}

function tdeeBase(){
  return bmr() * state.settings.activity;
}

function metForSpeed(speed){
  if(speed < 16) return 4;
  if(speed < 19) return 6;
  if(speed < 22) return 8;
  if(speed < 25) return 10;
  if(speed < 30) return 12;
  if(speed < 35) return 15.8;
  return 17.5;
}

function rideKcal(minutes, speed){
  const met = metForSpeed(speed);
  return Math.round(met * 3.5 * state.settings.weight / 200 * minutes);
}

function sumMeals(){ return state.log.meals.reduce((a,m)=>a+m.kcal,0); }
function sumRides(){ return state.log.rides.reduce((a,r)=>a+r.kcal,0); }

function dailyBudget(){
  return Math.round(tdeeBase() - state.settings.deficit + sumRides());
}

function mealTarget(pctKey){
  const budget = dailyBudget();
  return Math.round(budget * state.settings.mealSplit[pctKey] / 100);
}

function fmtDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString("de-CH", { weekday:"long", day:"2-digit", month:"2-digit" });
}

function uid(){ return Math.random().toString(36).slice(2,9); }

async function render(){
  const app = document.getElementById("app");
  app.innerHTML = `
    <header class="top">
      <h1>Tageskilometer</h1>
      <input class="date-pick" type="date" value="${state.date}" id="dateInput">
    </header>
    <nav class="tabs">
      <button data-tab="heute" class="${state.tab==='heute'?'active':''}">Heute</button>
      <button data-tab="plan" class="${state.tab==='plan'?'active':''}">Trainingsplan</button>
      <button data-tab="settings" class="${state.tab==='settings'?'active':''}">Einstellungen</button>
    </nav>
    <div id="tabContent"></div>
  `;
  document.getElementById("dateInput").addEventListener("change", async (e)=>{
    state.date = e.target.value;
    await loadLog(state.date);
    render();
  });
  app.querySelectorAll("nav.tabs button").forEach(b=>{
    b.addEventListener("click", ()=>{ state.tab = b.dataset.tab; render(); });
  });

  const content = document.getElementById("tabContent");
  if(state.tab === "heute") content.innerHTML = renderHeute();
  else if(state.tab === "plan") content.innerHTML = renderPlan();
  else content.innerHTML = renderSettings();

  attachTabHandlers();
}

function renderHeute(){
  const budget = dailyBudget();
  const eaten = sumMeals();
  const burned = sumRides();
  const remaining = budget - eaten;
  const wd = weekdayKey(state.date);
  const isRest = REST_DAYS.includes(wd);
  const plannedMin = state.settings.trainingPlan[wd];

  const mealRows = state.log.meals.length
    ? state.log.meals.map(m => `
      <div class="meal-row">
        <span>${labelMeal(m.type)} — ${m.kcal} kcal</span>
        <button class="del" data-kind="meal" data-id="${m.id}">✕</button>
      </div>`).join("")
    : `<div class="empty-hint">Noch keine Mahlzeit eingetragen.</div>`;

  const rideRows = state.log.rides.length
    ? state.log.rides.map(r => `
      <div class="ride-row">
        <span>${r.minutes} min @ ${r.speed} km/h — ${r.kcal} kcal</span>
        <button class="del" data-kind="ride" data-id="${r.id}">✕</button>
      </div>`).join("")
    : `<div class="empty-hint">Noch keine Fahrt eingetragen.</div>`;

  return `
    <div class="hero">
      <div class="label">${fmtDate(state.date)} — noch verfügbar</div>
      <div class="big">${remaining}<small>kcal</small></div>
      <div class="sub">
        <div>Tagesbudget<span class="num">${budget}</span></div>
        <div>Gegessen<span class="num">${eaten}</span></div>
        <div>Verbrannt (Rennrad)<span class="num">${burned}</span></div>
        <div>${isRest ? 'Ruhetag' : 'Geplant heute'}<span class="num">${isRest ? '—' : plannedMin + ' min'}</span></div>
      </div>
    </div>

    <div class="card">
      <h2>Mahlzeiten <span class="tag">Ziel: Mittag ${mealTarget('mittag')} · Zvieri ${mealTarget('zvieri')} · Znacht ${mealTarget('znacht')} kcal</span></h2>
      ${mealRows}
      <form class="add-row" id="mealForm">
        <select name="type">
          <option value="mittag">Mittagessen</option>
          <option value="zvieri">Zvieri</option>
          <option value="znacht">Znacht</option>
          <option value="sonstiges">Sonstiges</option>
        </select>
        <input type="number" name="kcal" placeholder="kcal" min="0" required>
        <button type="submit">Eintragen</button>
      </form>
    </div>

    <div class="card">
      <h2>Rennrad</h2>
      ${rideRows}
      <form class="add-row" id="rideForm">
        <input type="number" name="minutes" placeholder="Minuten" min="1" required>
        <input type="number" name="speed" placeholder="Ø km/h" min="1" step="0.1" required>
        <button type="submit">Eintragen</button>
      </form>
    </div>
  `;
}

function labelMeal(type){
  return { mittag:"Mittagessen", zvieri:"Zvieri", znacht:"Znacht", sonstiges:"Sonstiges" }[type] || type;
}

function renderPlan(){
  const rows = DAY_KEYS.map(k => {
    const isRest = REST_DAYS.includes(k);
    return `
      <tr>
        <td>${k}</td>
        <td>${DAY_LABELS[k]}</td>
        <td>
          ${isRest
            ? `<span class="rest-tag">Ruhetag</span>`
            : `<input type="number" min="0" step="5" data-day="${k}" value="${state.settings.trainingPlan[k]}"> min`}
        </td>
      </tr>`;
  }).join("");

  return `
    <div class="card">
      <h2>Wöchentlicher Trainingsplan <span class="tag">Rennrad-Minuten pro Tag</span></h2>
      <table class="plan-table">${rows}</table>
      <button class="save-btn" id="savePlan">Plan speichern</button>
      <span class="save-note" id="planNote"></span>
    </div>
  `;
}

function renderSettings(){
  const s = state.settings;
  return `
    <div class="card">
      <h2>Persönliche Angaben</h2>
      <div class="settings-grid">
        <div class="field">
          <label>Geschlecht</label>
          <select id="s_gender">
            <option value="m" ${s.gender==='m'?'selected':''}>Mann</option>
            <option value="w" ${s.gender==='w'?'selected':''}>Frau</option>
          </select>
        </div>
        <div class="field">
          <label>Alter</label>
          <input type="number" id="s_age" value="${s.age}" min="14" max="90">
        </div>
        <div class="field">
          <label>Grösse (cm)</label>
          <input type="number" id="s_height" value="${s.height}" min="120" max="230">
        </div>
        <div class="field">
          <label>Aktuelles Gewicht (kg)</label>
          <input type="number" id="s_weight" value="${s.weight}" min="30" max="250" step="0.1">
        </div>
        <div class="field">
          <label>Zielgewicht (kg)</label>
          <input type="number" id="s_goal" value="${s.goalWeight}" min="30" max="250" step="0.1">
        </div>
        <div class="field">
          <label>Alltagsaktivität (ohne Rennrad)</label>
          <select id="s_activity">
            <option value="1.2" ${s.activity==1.2?'selected':''}>Sitzend</option>
            <option value="1.3" ${s.activity==1.3?'selected':''}>Leicht aktiv</option>
            <option value="1.55" ${s.activity==1.55?'selected':''}>Mässig aktiv</option>
          </select>
        </div>
        <div class="field">
          <label>Tagesdefizit (kcal)</label>
          <input type="number" id="s_deficit" value="${s.deficit}" min="0" max="1000" step="50">
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Mahlzeiten-Aufteilung <span class="tag">kein Zmorgen, muss 100% ergeben</span></h2>
      <div class="split-row">
        <div class="field"><label>Mittagessen %</label><input type="number" id="sp_mittag" value="${s.mealSplit.mittag}" min="0" max="100"></div>
        <div class="field"><label>Zvieri %</label><input type="number" id="sp_zvieri" value="${s.mealSplit.zvieri}" min="0" max="100"></div>
        <div class="field"><label>Znacht %</label><input type="number" id="sp_znacht" value="${s.mealSplit.znacht}" min="0" max="100"></div>
      </div>
      <div class="warn" id="splitWarn"></div>
      <button class="save-btn" id="saveSettings">Einstellungen speichern</button>
      <span class="save-note" id="settingsNote"></span>
      <div class="info-line">
        Grundumsatz (BMR): <span class="num">${Math.round(bmr())}</span> kcal ·
        Umsatz ohne Rennrad (TDEE): <span class="num">${Math.round(tdeeBase())}</span> kcal ·
        Tagesbudget ohne Fahrt: <span class="num">${Math.round(tdeeBase()-s.deficit)}</span> kcal<br>
        Bei ${s.deficit} kcal Defizit/Tag sind das rund ${(s.deficit*7/7700).toFixed(2)} kg Gewichtsverlust pro Woche —
        bis ${s.goalWeight} kg dauert das etwa ${Math.max(1, Math.round((s.weight-s.goalWeight)*7700/(s.deficit*7)))} Wochen.
      </div>
    </div>
  `;
}

function attachTabHandlers(){
  if(state.tab === "heute"){
    const mealForm = document.getElementById("mealForm");
    if(mealForm) mealForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const fd = new FormData(mealForm);
      state.log.meals.push({ id: uid(), type: fd.get("type"), kcal: parseInt(fd.get("kcal"),10) });
      await saveLog();
      render();
    });
    const rideForm = document.getElementById("rideForm");
    if(rideForm) rideForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      const fd = new FormData(rideForm);
      const minutes = parseFloat(fd.get("minutes"));
      const speed = parseFloat(fd.get("speed"));
      state.log.rides.push({ id: uid(), minutes, speed, kcal: rideKcal(minutes, speed) });
      await saveLog();
      render();
    });
    document.querySelectorAll(".del").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        const id = btn.dataset.id;
        if(btn.dataset.kind === "meal") state.log.meals = state.log.meals.filter(m=>m.id!==id);
        else state.log.rides = state.log.rides.filter(r=>r.id!==id);
        await saveLog();
        render();
      });
    });
  }

  if(state.tab === "plan"){
    const btn = document.getElementById("savePlan");
    btn.addEventListener("click", async ()=>{
      document.querySelectorAll(".plan-table input[data-day]").forEach(inp=>{
        state.settings.trainingPlan[inp.dataset.day] = parseInt(inp.value,10) || 0;
      });
      await saveSettings();
      document.getElementById("planNote").textContent = "Gespeichert.";
      setTimeout(render, 600);
    });
  }

  if(state.tab === "settings"){
    const btn = document.getElementById("saveSettings");
    btn.addEventListener("click", async ()=>{
      const mittag = parseInt(document.getElementById("sp_mittag").value,10) || 0;
      const zvieri = parseInt(document.getElementById("sp_zvieri").value,10) || 0;
      const znacht = parseInt(document.getElementById("sp_znacht").value,10) || 0;
      if(mittag + zvieri + znacht !== 100){
        document.getElementById("splitWarn").textContent = "Die drei Prozentwerte müssen zusammen 100% ergeben (aktuell " + (mittag+zvieri+znacht) + "%).";
        return;
      }
      document.getElementById("splitWarn").textContent = "";
      state.settings.gender = document.getElementById("s_gender").value;
      state.settings.age = parseInt(document.getElementById("s_age").value,10);
      state.settings.height = parseFloat(document.getElementById("s_height").value);
      state.settings.weight = parseFloat(document.getElementById("s_weight").value);
      state.settings.goalWeight = parseFloat(document.getElementById("s_goal").value);
      state.settings.activity = parseFloat(document.getElementById("s_activity").value);
      state.settings.deficit = parseInt(document.getElementById("s_deficit").value,10);
      state.settings.mealSplit = { mittag, zvieri, znacht };
      await saveSettings();
      document.getElementById("settingsNote").textContent = "Gespeichert.";
      setTimeout(render, 600);
    });
  }
}

(async function init(){
  await loadSettings();
  await loadLog(state.date);
  render();
})();
</script>
</body>
</html>
